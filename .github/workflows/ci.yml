name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Baseline check
        run: |
          pip install --quiet detect-secrets
          detect-secrets scan --baseline .secrets.baseline \
            --exclude-files 'pdf2john\.pl' --exclude-files 'lib/'

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: detect-secrets
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: docker build -t pdf2john .

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [detect-secrets, build]
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: docker build -t pdf2john .

      - name: Run tests
        run: make test IMAGE=pdf2john
